name: Damp
options:
  bundleIdPrefix: app.getdamp
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""            # set your team in Xcode or here
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"    # iPhone only for v1
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.0.0"

targets:
  Damp:
    type: application
    platform: iOS
    sources:
      - path: Damp
      - path: Shared
    dependencies:
      - target: DampWidgets
      - package: PostHog
    entitlements:
      path: Damp/Damp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.getdamp.damp
    info:
      path: Damp/Info.plist
      properties:
        CFBundleDisplayName: Damp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.getdamp.damp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: [DampTests]
      storeKitConfiguration: Damp/Resources/Products.storekit

  DampTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DampTests
    dependencies:
      - target: Damp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.getdamp.damp.tests
        GENERATE_INFOPLIST_FILE: true

  DampWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: DampWidgets
      - path: Shared
      - path: Damp/Intents/LogDryNightIntent.swift
    entitlements:
      path: DampWidgets/DampWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.getdamp.damp
    info:
      path: DampWidgets/Info.plist
      properties:
        CFBundleDisplayName: Damp Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.getdamp.damp.widgets
